<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap | Muhammed Mazin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sage: #333333;
    --sage-deep: #111111;
    --sage-light: #555555;
    --cream: #FFFFFF;
    --cream-dark: #F5F5F5;
    --gold: #888888;
    --gold-light: #AAAAAA;
    --white: #FFFFFF;
    --dark: #000000;
    --dark-mid: #222222;
    --text: #111111;
    --text-light: #444444;
    --text-muted: #777777;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    min-height: 100vh;
  }

  .serif { font-family: 'DM Serif Display', serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Navigation */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    transition: all 0.3s;
  }
  nav.scrolled {
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
  }
  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--dark);
    text-decoration: none;
    letter-spacing: -0.3px;
  }
  .nav-logo span { color: var(--sage-deep); }
  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }
  .nav-links a {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-light);
    text-decoration: none;
    letter-spacing: 0.3px;
    transition: color 0.3s;
    position: relative;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--gold);
    transition: width 0.3s;
  }
  .nav-links a:hover { color: var(--dark); }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    font-size: 13px;
    font-weight: 600;
    padding: 10px 22px;
    border: 1.5px solid var(--sage);
    color: var(--sage-deep);
    border-radius: 100px;
    text-decoration: none;
    transition: all 0.3s;
    letter-spacing: 0.3px;
  }
  .nav-cta:hover {
    background: var(--sage);
    color: var(--white);
  }

  .mobile-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
  }
  .mobile-toggle span {
    width: 24px;
    height: 2px;
    background: var(--dark);
    border-radius: 2px;
    transition: 0.3s;
  }

  /* Roadmap Section */
  .roadmap-section {
    padding: 140px 40px 80px;
    min-height: 100vh;
  }
  .roadmap-inner {
    max-width: 900px;
    margin: 0 auto;
  }
  .roadmap-header {
    text-align: center;
    margin-bottom: 60px;
  }
  .roadmap-header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 48px;
    color: var(--dark);
    margin-bottom: 16px;
  }
  .roadmap-header p {
    font-size: 16px;
    color: var(--text-light);
  }
  .roadmap-image {
    text-align: center;
  }
  .roadmap-image img {
    max-width: 100%;
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,0.1);
    box-shadow: 0 24px 64px rgba(0,0,0,0.08);
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 40px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-light);
    text-decoration: none;
    transition: color 0.3s;
  }
  .back-link:hover { color: var(--dark); }

  /* Footer */
  footer {
    padding: 40px;
    text-align: center;
  }
  footer p {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  /* Mobile */
  @media (max-width: 900px) {
    .nav-links {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      flex-direction: column;
      padding: 20px 40px 28px;
      gap: 0;
      border-bottom: 1px solid var(--sage-light);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }
    .nav-links.show { display: flex; }
    .nav-links li { padding: 12px 0; border-bottom: 1px solid rgba(0, 0, 0, 0.1); }
    .nav-links li:last-child { border-bottom: none; }
    .nav-links a { font-size: 15px; }
    .nav-cta { display: none; }
    .mobile-toggle { display: flex; }
    .roadmap-section { padding: 120px 20px 60px; }
    .roadmap-header h1 { font-size: 36px; }
    .nav-inner { padding: 14px 20px; }
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">mazin<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#skills">Skills</a></li>
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="index.html#education">Education</a></li>
      <li><a href="index.html#certifications">Certifications</a></li>
      <li><a href="roadmap.html">Roadmap</a></li>
    </ul>
    <a href="mailto:muhammedmzinpnn@gmail.com" class="nav-cta">Let's Talk</a>
    <button class="mobile-toggle" onclick="document.querySelector('.nav-links').classList.toggle('show')" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Roadmap -->
<section class="roadmap-section">
  <div class="roadmap-inner">
    <div class="roadmap-header">
      <h1>Roadmap</h1>
      <p>My learning path and future goals</p>
    </div>
    <div class="roadmap-image">
      <img src="mazinroadmap.jpeg" alt="Muhammed Mazin Roadmap">
    </div>
    <div style="text-align: center;">
      <a href="index.html" class="back-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Home
      </a>
    </div>
  </div>
</section>

<!-- Footer -->
<footer>
  <p>Built by Muhammed Mazin &copy; 2026</p>
</footer>

<script>
  // Nav scroll effect
  window.addEventListener('scroll', () => {
    document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20);
  });

  // Mobile nav toggle
  const mobileToggle = document.querySelector('.mobile-toggle');
  const navLinks = document.querySelector('.nav-links');
  mobileToggle.addEventListener('click', () => {
    navLinks.classList.toggle('show');
  });
  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', () => navLinks.classList.remove('show'));
  });
</script>
</body>
</html>
